<div class="pocket-phone-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Pocket Phone 小手机</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="pocket_phone_enabled">
                <input id="pocket_phone_enabled" type="checkbox" />
                <span>启用小手机入口按钮</span>
            </label>
            <label class="checkbox_label" for="pocket_phone_sync_main">
                <input id="pocket_phone_sync_main" type="checkbox" />
                <span>短信同步写入主聊天（默认关闭，避免污染主线）</span>
            </label>
            <div class="flex-container flexGap5 marginTop10">
                <div id="pocket_phone_open_from_settings" class="menu_button menu_button_icon">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <span>打开小手机</span>
                </div>
            </div>
            <small class="marginTop10">
                安装仓库：https://github.com/vpocket-99/st-pocket-phone
            </small>
        </div>
    </div>
</div>
